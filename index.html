<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Profile Card UI Design</title>

<!-- CSS Styles -->
<link rel="stylesheet" href="style.css">

<!-- Boxicons css-->
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
  <div class="profile-card">
    <div class="image">
      <img src="profile.jpg" alt="Samay Raina" class="profile-img">
    </div>
    <div class="text-data">
      <span class="name">Samay Raina </span>
      <span class="job">Software Developer</span>
    </div>
    
    <div class="media-button">
      <a href="#" style="background: #156ee1" class="link">
<i class='bx bxl-facebook-circle'></i>  </a>

      <a href="#" style="background: #06d6a0 " class="link">
<i class='bx bxl-whatsapp-square' ></i>  </a>

      <a href="#" style="background: #d90e95" class="link">
<i class='bx bxl-instagram' ></i>  </a>

      <a href="#" style="background: #33415c" class="link">
<i class='bx bxl-twitter' ></i>  </a>

    </div>

    <div class="buttons">
      <button class="button">Subscribe</button>
      <button class="button">Message</button>
  </div>

  <div class="analytics">
    <div class="data">
<i class='bx bx-heart' ></i>
          <span class="number">60K</span>
    </div>   

    <div class="data">
<i class='bx bx-message-rounded'></i>   
 <span class="number">20K</span>

</div>             
    
<div class="data">
<i class='bx bxs-share'></i>         
 <span class="number">10K</span>
    </div>             
  </div>
</div>
</body>
</html>
